name: CI
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache:npm
      - run: npm ci
      - run: npm run lint
      - run: nps  install
      - run: npm tsc --noEmit
      - run: npm run test:coverage
      - run: npm run build
  